name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Shellcheck
        run: shellcheck bin/spec-deliver-gate scripts/setup.sh tests/*.sh

      - name: Skill regression checks
        run: bash tests/skill-lint.sh

      - name: Gate tests
        run: bash tests/gate.test.sh
