schema: spec-driven

context: |
  Tech stack: {{TECH_STACK}}
  Delivery: spec-deliver delivers each task group test-first, and a gate checks the result.

rules:
  proposal:
    - Keep it short. State why, what changes, and what is out of scope
    - List anything an agent cannot do, such as provisioning or secrets, under an "Out-of-band steps" heading, and keep those steps out of tasks.md
  specs:
    - Use SHALL or MUST in every requirement body, never should or may
    - Every requirement MUST have at least one scenario that a test can prove
    - Write the fewest requirements that cover the change
  design:
    - Record only decisions a reader could not work out from the code. A stub is fine for a small change
  tasks:
    - Group tasks under numbered headings such as "## 1. Add export endpoint". Fresh agents deliver each group, so it must make sense on its own
    - Mark a group with no tests of its own as "(no-test)" and a behaviour-preserving group as "(refactor)" in its heading
    - Do not add separate tasks for writing tests. Delivery writes each group's tests first
