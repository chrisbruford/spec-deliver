schema: spec-driven-tracey

context: |
  Tech stack: {{TECH_STACK}}
  Requirement traceability: Tracey (prefix: r)
  Autonomous delivery: Ralph loop via Claude Code plugin
  All specs MUST include Tracey requirement markers (r[capability.requirement-name])
  All implementation code MUST include r[impl ...] annotations
  All test code MUST include r[verify ...] annotations

rules:
  specs:
    - Every requirement MUST have a Tracey marker blockquote (> r[capability.requirement-name]) immediately after the ### Requirement heading
    - Tracey IDs use the pattern capability.kebab-requirement-name where capability matches the spec folder name
    - Use SHALL/MUST for normative requirements, never should/may
    - Every requirement MUST have at least one testable scenario
  tasks:
    - Each task MUST reference the Tracey requirement ID(s) it implements in parentheses
    - Include explicit tasks for writing tests with r[verify ...] annotations
    - Order tasks to implement tests before or alongside production code (TDD)
  design:
    - Note which Tracey requirement IDs are affected by each design decision
