name: Spec validation

# Gates every PR on the openspec strict validator, which catches malformed
# requirement blocks, missing scenarios and missing SHALL or MUST keywords.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: spec-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install openspec
        run: npm install -g @fission-ai/openspec@1.12.0

      - name: openspec validate --all --strict
        run: openspec validate --all --strict
